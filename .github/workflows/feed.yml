name: feed

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  feed:
    if: "!startsWith(github.event.release.tag_name, 'target-files-')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the ota zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" -p 'lineage-*.zip' -D zips

      - name: Update the feed
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.release.body }}
        run: |
          CHANGELOG=$(printf '%s\n' "$BODY" | tr -d '\r' | sed -n '/^## Changelog$/,$p' | sed '1d')
          FULL=""
          INC=""
          for z in zips/*.zip; do
            if unzip -p "$z" META-INF/com/android/metadata | grep -q '^pre-build-incremental='; then
              INC="$z"
            else
              FULL="$z"
            fi
          done
          if [ -z "$FULL" ]; then
            echo "missing full ota zip" >&2
            exit 1
          fi
          REC=$(gh release view "${{ github.event.release.tag_name }}" --json assets -q '.assets[].name | select(endswith("-recovery.tar.md5"))' | head -n 1)
          python3 release.py "$FULL" ${INC:+--incremental "$INC"} ${REC:+--recovery "$REC"} ${CHANGELOG:+--changelog "$CHANGELOG"}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.json' download changelog $(ls -d a14 a13 2>/dev/null)
          git diff --cached --quiet && exit 0
          git commit -m "feed: ${{ github.event.release.tag_name }}"
          git push origin main
