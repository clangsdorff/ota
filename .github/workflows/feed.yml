name: feed

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the ota zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" -p 'lineage-*.zip' -D zips

      - name: Update the feed
        run: |
          for z in zips/*.zip; do python3 release.py "$z"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.json'
          git diff --cached --quiet && exit 0
          git commit -m "feed: ${{ github.event.release.tag_name }}"
          git push origin main
